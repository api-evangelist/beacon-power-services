name: Beacon Power Services
description: 'Beacon Power Services (BPS) is an African energy-technology company building software
  that helps electricity utilities and energy consumers manage the power grid more efficiently. Its
  platform spans three products: CAIMS, a customer and asset information management system for utility
  network, survey, installation, and new-service-connection management; Adora, a grid network management
  solution for commercial operations, network management, and field operations that helps utilities
  optimize operations and increase profitability; and Xepp, a consumer mobile app for energy consumption
  monitoring, instant electricity top-up, solar integration, and flexible payments. BPS serves utilities
  and distribution companies across Africa (clients include ECG and AEDC) and is backed by Partech. This
  profile currently has no public API or developer surface; it is tracked in the API Evangelist network
  as a company lead.'
